name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checkout-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Run unit tests
        run: dotnet test --no-build --verbosity normal
      
      - name: Build Docker image
        run: docker build -t taskmanager-api:${{ github.sha }} .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskmanager-api:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        run: |
          docker tag taskmanager-api:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager-api:${{ github.sha }}
          docker tag taskmanager-api:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/taskmanager-api:latest